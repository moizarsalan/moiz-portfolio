name: Build and deploy Laravel API to Azure App Service

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, intl, curl, xml, zip, pdo_mysql
          coverage: none

      - name: Verify Laravel project
        working-directory: backend
        run: |
          php --version
          composer --version
          test -f composer.json
          test -f artisan

      - name: Install Laravel dependencies
        working-directory: backend
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      - name: Prepare Laravel storage directories
        working-directory: backend
        run: |
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

      - name: Create deployment package
        run: |
          cd backend

          zip -r ../backend-deploy.zip . \
            -x ".env" \
            -x ".env.*" \
            -x ".git/*" \
            -x "storage/logs/*.log"

      - name: Upload Laravel deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-backend
          path: backend-deploy.zip
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Laravel artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A158E7435952460FB4790134228C8BB6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CE4CD6551B904B9E9C4C755E46199E73 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D1512F8FDD214F8FA53F7DF4914B9481 }}

      - name: Deploy Laravel to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "moiz-portfolio-api"
          slot-name: "Production"
          package: backend-deploy.zip

      - name: Logout from Azure
        if: always()
        run: az logout
